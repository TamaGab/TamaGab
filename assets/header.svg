<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- darker background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F1117"></stop>
      <stop offset="0.45" stop-color="#131722"></stop>
      <stop offset="1" stop-color="#0D1018"></stop>
    </linearGradient>

    <!-- subtle glow overlays -->
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 150) rotate(20) scale(360 180)">
      <stop stop-color="#88C0D0" stop-opacity="0.18"></stop>
      <stop offset="1" stop-color="#88C0D0" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1030 170) rotate(-10) scale(300 180)">
      <stop stop-color="#C678DD" stop-opacity="0.16"></stop>
      <stop offset="1" stop-color="#C678DD" stop-opacity="0"></stop>
    </radialGradient>

    <!-- title gradient -->
    <linearGradient id="titleGrad" x1="210" y1="110" x2="780" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9CDCFE"></stop>
      <stop offset="0.55" stop-color="#B48EAD"></stop>
      <stop offset="1" stop-color="#D16DFF"></stop>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#88C0D0" stop-opacity="0.8"></stop>
      <stop offset="0.5" stop-color="#81A1C1" stop-opacity="0.22"></stop>
      <stop offset="1" stop-color="#D16DFF" stop-opacity="0.8"></stop>
    </linearGradient>

    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <pattern id="smallGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#4C566A" stroke-opacity="0.16" stroke-width="1"></path>
    </pattern>

    <pattern id="bigGrid" width="112" height="112" patternUnits="userSpaceOnUse">
      <path d="M 112 0 L 0 0 0 112" fill="none" stroke="#4C566A" stroke-opacity="0.3" stroke-width="1"></path>
    </pattern>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
      .sans { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; }
      .textMain { fill: #E5E9F0; }
      .textSoft { fill: #AEB8C8; }
      .textMuted { fill: #8C96A8; }
      .cyan { fill: #88C0D0; }
      .purple { fill: #C678DD; }
      .tiny { font-size: 12px; letter-spacing: 2.8px; }
      .small { font-size: 14px; letter-spacing: 2px; }
      .label { font-size: 15px; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- base -->
  <rect width="1280" height="320" rx="18" fill="url(#bg)"></rect>
  <rect width="1280" height="320" rx="18" fill="url(#smallGrid)"></rect>
  <rect width="1280" height="320" rx="18" fill="url(#bigGrid)"></rect>

  <!-- ambient glows -->
  <rect width="1280" height="320" rx="18" fill="url(#glowLeft)"></rect>
  <rect width="1280" height="320" rx="18" fill="url(#glowRight)"></rect>

  <!-- outer frame -->
  <path d="M22 52 L22 18 L1258 18 L1258 302 L22 302 L22 268" stroke="url(#lineGrad)" stroke-opacity="0.7" stroke-width="1.2"></path>
  <path d="M22 52 L36 64 L120 64" stroke="#88C0D0" stroke-opacity="0.55" stroke-width="1.2"></path>
  <path d="M1148 64 L1244 64 L1258 50" stroke="#D16DFF" stroke-opacity="0.55" stroke-width="1.2"></path>
  <path d="M22 268 L38 286 L124 286" stroke="#88C0D0" stroke-opacity="0.38" stroke-width="1.2"></path>
  <path d="M1110 286 L1242 286 L1258 270" stroke="#D16DFF" stroke-opacity="0.38" stroke-width="1.2"></path>

  <!-- top-left small line -->
  <text x="42" y="42" class="mono tiny textMuted">root@tamagab:~$ init profile</text>

  <!-- top-right status -->
  <rect x="982" y="34" width="210" height="44" rx="10" fill="#161B26" stroke="#88C0D0" stroke-opacity="0.34"></rect>
  <text x="1006" y="61" class="mono small textMain">STATUS</text>
  <circle cx="1090" cy="56" r="6.5" fill="#5EEAD4" filter="url(#glowCyan)"></circle>
  <text x="1111" y="61" class="mono small cyan">ONLINE</text>

  <!-- left rail -->
  <line x1="165" y1="84" x2="165" y2="242" stroke="#81A1C1" stroke-opacity="0.45" stroke-width="1.1"></line>
  <text x="46" y="106" class="mono" font-size="34" fill="#88C0D0">&gt;_</text>
  <text x="46" y="138" class="mono label textSoft">LINUX</text>
  <text x="46" y="162" class="mono label textSoft">INFRA</text>
  <text x="46" y="186" class="mono label textSoft">NETWORKS</text>
  <text x="46" y="210" class="mono label textSoft">SECURITY</text>
  <text x="46" y="234" class="mono label textSoft">OSS</text>

  <!-- central title -->
  <text x="205" y="146" class="mono" font-size="58" font-weight="700" fill="url(#titleGrad)">Gabriel Tamarossi</text>

  <!-- scanline/accent under title -->
  <line x1="207" y1="160" x2="785" y2="160" stroke="url(#lineGrad)" stroke-opacity="0.45"></line>
  <line x1="207" y1="161" x2="585" y2="161" stroke="#88C0D0" stroke-opacity="0.3"></line>

  <!-- primary subtitle -->
  <text x="205" y="203" class="mono" font-size="26" fill="#E5E9F0">Linux · Infrastructure · Security</text>

  <!-- secondary subtitle -->
  <text x="205" y="238" class="mono" font-size="15" fill="#AAB4C3" letter-spacing="1.2">
    Networking · Open Source · Systems Analysis &amp; Development
  </text>

  <!-- terminal-ish command line -->
  <text x="205" y="281" class="mono tiny textMuted">build --operate --break --understand --secure</text>

  <!-- right visual area -->
  <g opacity="0.97">
    <!-- subtle dotted area -->
    <g opacity="0.22">
      <circle cx="910" cy="112" r="1.5" fill="#88C0D0"></circle>
      <circle cx="930" cy="122" r="1.5" fill="#88C0D0"></circle>
      <circle cx="950" cy="100" r="1.5" fill="#88C0D0"></circle>
      <circle cx="972" cy="130" r="1.5" fill="#88C0D0"></circle>
      <circle cx="992" cy="112" r="1.5" fill="#88C0D0"></circle>
      <circle cx="1014" cy="98" r="1.5" fill="#88C0D0"></circle>
      <circle cx="1038" cy="122" r="1.5" fill="#88C0D0"></circle>
      <circle cx="1060" cy="108" r="1.5" fill="#88C0D0"></circle>
      <circle cx="1086" cy="132" r="1.5" fill="#88C0D0"></circle>
      <circle cx="1110" cy="112" r="1.5" fill="#88C0D0"></circle>
      <circle cx="1136" cy="125" r="1.5" fill="#88C0D0"></circle>
      <circle cx="1160" cy="106" r="1.5" fill="#88C0D0"></circle>

      <circle cx="918" cy="154" r="1.5" fill="#C678DD"></circle>
      <circle cx="945" cy="168" r="1.5" fill="#C678DD"></circle>
      <circle cx="972" cy="148" r="1.5" fill="#C678DD"></circle>
      <circle cx="1000" cy="178" r="1.5" fill="#C678DD"></circle>
      <circle cx="1030" cy="160" r="1.5" fill="#C678DD"></circle>
      <circle cx="1060" cy="148" r="1.5" fill="#C678DD"></circle>
      <circle cx="1092" cy="174" r="1.5" fill="#C678DD"></circle>
      <circle cx="1120" cy="156" r="1.5" fill="#C678DD"></circle>
      <circle cx="1150" cy="168" r="1.5" fill="#C678DD"></circle>
    </g>

    <!-- network lines -->
    <line x1="940" y1="196" x2="992" y2="138" stroke="#88C0D0" stroke-width="1.8" stroke-opacity="0.9"></line>
    <line x1="992" y1="138" x2="1114" y2="164" stroke="#7DB8FF" stroke-width="1.8" stroke-opacity="0.75"></line>
    <line x1="1114" y1="164" x2="1080" y2="244" stroke="#D16DFF" stroke-width="1.9" stroke-opacity="0.88"></line>
    <line x1="1080" y1="244" x2="940" y2="196" stroke="#88C0D0" stroke-width="1.8" stroke-opacity="0.72"></line>
    <line x1="992" y1="138" x2="1080" y2="244" stroke="#C678DD" stroke-width="1.6" stroke-opacity="0.68"></line>
    <line x1="940" y1="196" x2="1114" y2="164" stroke="#81A1C1" stroke-width="1.6" stroke-opacity="0.45"></line>

    <!-- nodes -->
    <circle cx="940" cy="196" r="18" fill="#121722" stroke="#88C0D0" stroke-width="2"></circle>
    <circle cx="940" cy="196" r="6" fill="#88C0D0" filter="url(#glowCyan)"></circle>

    <circle cx="992" cy="138" r="18" fill="#121722" stroke="#8FBCBB" stroke-width="2"></circle>
    <circle cx="992" cy="138" r="6" fill="#8FBCBB" filter="url(#glowCyan)"></circle>

    <circle cx="1114" cy="164" r="18" fill="#121722" stroke="#B48EAD" stroke-width="2"></circle>
    <circle cx="1114" cy="164" r="6" fill="#B48EAD" filter="url(#glowPurple)"></circle>

    <circle cx="1080" cy="244" r="18" fill="#121722" stroke="#D16DFF" stroke-width="2"></circle>
    <circle cx="1080" cy="244" r="6" fill="#D16DFF" filter="url(#glowPurple)"></circle>

    <!-- labels -->
    <text x="900" y="186" class="mono small textMain">INFRA</text>
    <text x="972" y="116" class="mono small textMain">DEV</text>
    <text x="1138" y="167" class="mono small textMain">SEC</text>
    <text x="1048" y="272" class="mono small textMain">OSS</text>
  </g>

  <!-- bottom-left motto -->
  <line x1="38" y1="262" x2="38" y2="292" stroke="#88C0D0" stroke-opacity="0.55"></line>
  <text x="52" y="268" class="mono small textMuted">STABLE SYSTEMS</text>
  <text x="52" y="290" class="mono small textMuted">BETTER POSSIBILITIES</text>

  <!-- tiny corner detail -->
  <text x="1198" y="286" class="mono small purple">///</text>
</svg>