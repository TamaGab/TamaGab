<svg width="1000" height="270" viewBox="0 0 1000 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1000" y2="270">
      <stop stop-color="#88C0D0"></stop>
      <stop offset="0.55" stop-color="#81A1C1"></stop>
      <stop offset="1" stop-color="#C678DD"></stop>
    </linearGradient>

    <linearGradient id="prompt" x1="50" y1="0" x2="520" y2="0">
      <stop stop-color="#88C0D0"></stop>
      <stop offset="1" stop-color="#C678DD"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <style>
      .mono {
        font-family: "JetBrains Mono", "Fira Code", "Consolas", monospace;
      }
    </style>
  </defs>

  <!-- terminal -->
  <rect x="1" y="1" width="998" height="268" rx="14" fill="#0D1018" stroke="url(#border)" stroke-opacity="0.65" stroke-width="2"></rect>

  <!-- title bar -->
  <rect x="1" y="1" width="998" height="42" rx="14" fill="#151A24"></rect>

  <path d="M1 42H999" stroke="#4C566A" stroke-opacity="0.55"></path>

  <!-- terminal buttons -->
  <circle cx="25" cy="21" r="5" fill="#BF616A"></circle>
  <circle cx="45" cy="21" r="5" fill="#EBCB8B"></circle>
  <circle cx="65" cy="21" r="5" fill="#A3BE8C"></circle>

  <text x="500" y="27" text-anchor="middle" class="mono" font-size="13" fill="#7F8999">
    gabriel@systems:~
  </text>

  <!-- command -->
  <text x="40" y="82" class="mono" font-size="17" fill="#88C0D0">
    gabriel@systems
  </text>

  <text x="191" y="82" class="mono" font-size="17" fill="#D8DEE9">
    :
  </text>

  <text x="203" y="82" class="mono" font-size="17" fill="#B48EAD">
    ~
  </text>

  <text x="220" y="82" class="mono" font-size="17" fill="#D8DEE9">
    $ cat /etc/motd
  </text>

  <!-- output guide -->
  <line x1="41" y1="105" x2="41" y2="221" stroke="url(#prompt)" stroke-width="2" stroke-opacity="0.75"></line>

  <!-- output -->
  <text x="66" y="126" class="mono" font-size="18" fill="#D8DEE9">
    Build it.
  </text>

  <text x="66" y="151" class="mono" font-size="18" fill="#D8DEE9">
    Run it.
  </text>

  <text x="66" y="176" class="mono" font-size="18" fill="#D8DEE9">
    Break it.
  </text>

  <text x="66" y="201" class="mono" font-size="18" fill="#D8DEE9">
    Understand why.
  </text>

  <text x="66" y="226" class="mono" font-size="18" fill="#88C0D0">
    Secure it.
  </text>

  <!-- cursor -->
  <rect x="158" y="211" width="10" height="18" rx="1" fill="#C678DD" opacity="0.85" filter="url(#glow)"></rect>

  <!-- corner decoration -->
  <text x="925" y="240" class="mono" font-size="13" fill="#B48EAD" opacity="0.7">
    /// MOTD
  </text>
</svg>